<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecNews Knowledge Dashboard — 全站重构交互 Demo（哨兵编辑部 × 安全终端）</title>
<meta name="description" content="Hotspot v0.8.9 全站前端重构可交互 demo：44 页面路由全覆盖 + 未实现标记 + 三态主题。纯静态演示，不连后端。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2304785c'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='monospace'%3E%E5%93%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main-content">跳到主要内容</a>
<div class="sn-shell">

  <!-- ① masthead 报头：品牌 + 四菜单 + 命令栏 + 主题 + 时钟 -->
  <header class="sn-mast">
    <div class="sn-brand">
      <span class="sn-title">SecNews</span>
      <span class="sn-sub">Security Intel Station · v0.8.9 Redesign Demo</span>
    </div>
    <nav class="sn-nav" aria-label="四菜单"></nav>
    <div class="sn-tools">
      <button class="theme-btn" onclick="App.cycleTheme()" title="light / dark / paper 三态轮换">◐ 主题</button>
      <span class="sn-clock num" id="clock">--:--:--</span>
    </div>
    <div id="cmd-slot" style="position:relative"></div>
  </header>

  <!-- ② bandnav 版面条：当前菜单二级域 chips -->
  <div class="sn-band" id="band" aria-label="二级域"></div>

  <!-- ③ pressbar 印务条：管道心跳条（全站常驻） -->
  <div id="presswrap"></div>

  <!-- 主内容 -->
  <main class="sn-main" id="main"><span id="main-content"></span></main>

  <div id="toast" aria-live="polite"></div>
</div>

<script src="assets/js/registry.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
<script>
  /* 命令栏挂载到报头工具区（静态注入一次；交互函数见 app.js） */
  (function () {
    var slot = document.getElementById('cmd-slot');
    var el = document.createElement('div');
    el.style.position = 'relative';
    el.innerHTML = '<div class="cmd"><span class="cmd-k">⌘K</span>' +
      '<input id="cmd-in" placeholder="查询 / 建案 / 出报告 / 执行…" onfocus="App.cmdPop(1)" onblur="App.cmdPop(0)" onkeydown="App.cmdKey(event)">' +
      '<div class="cmd-pop" id="cmd-pop" style="display:none"></div></div>';
    slot.parentNode.replaceChild(el, slot);
  })();
</script>
</body>
</html>
