name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall backend/
          echo "Python syntax OK"

      - name: Ruff lint
        run: |
          python -m pip install ruff
          ruff check backend/

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock --skip-editable

      - name: Run Python tests
        run: |
          python -m pytest backend/tests/ --tb=short -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high || true

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest tests
        run: npx vitest run

      - name: Vite build (smoke test)
        run: npx vite build --logLevel error
        env:
          CI: true
