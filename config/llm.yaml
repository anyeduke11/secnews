# hotspot/config/llm.yaml
# v2.0 新增：local LLM 配置，缺失时降级为 v1.7 Option A

enabled: true  # 总开关；false 时降级为外部 Agent 模式
default_provider: openai  # openai | ollama | qwen | anthropic
fallback_order:  # 失败时降级顺序
  - ollama       # 优先本地（零成本）
  - qwen         # 次选国产
  - openai       # 末选 openai

providers:
  ollama:
    type: ollama
    base_url: "http://127.0.0.1:11434"
    models:
      score: "qwen2.5:7b"
      tag: "qwen2.5:7b"
      ner: "qwen2.5:7b"
      summary: "qwen2.5:14b"
      chunk_summary: "qwen2.5:7b"
    timeout_seconds: 30
    max_concurrent: 4

  openai:
    type: openai
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models:
      score: "gpt-4o-mini"
      tag: "gpt-4o-mini"
      ner: "gpt-4o-mini"
      summary: "gpt-4o"
      chunk_summary: "gpt-4o-mini"
    timeout_seconds: 20
    max_concurrent: 8

  qwen:
    type: openai_compatible
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      score: "qwen-turbo"
      tag: "qwen-turbo"
      ner: "qwen-turbo"
      summary: "qwen-plus"
      chunk_summary: "qwen-turbo"

  anthropic:
    type: anthropic
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      summary: "claude-3-5-sonnet-20241022"
      chunk_summary: "claude-3-5-haiku-20241022"

task_overrides:
  t1_score:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.0
    max_tokens: 50
  t3_summary:
    provider: openai
    model: gpt-4o
    temperature: 0.3
    max_tokens: 500
  t3_chunk_summary:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.0
    max_tokens: 100
    batch_size: 10

rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 100000

cost_alert:
  daily_usd_limit: 5.0
  monthly_usd_limit: 100.0
  on_exceeded: warn  # warn | block | fallback_local

cache:
  enabled: true
  ttl_seconds: 86400  # 24h
  similarity_threshold: 0.95