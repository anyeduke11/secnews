<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">SecNews 路线图 — 5 个发布版本</title>
  <desc id="rm-desc">从 v0.4.3 到 v0.7.0 的 5 个发布版本横向时间线。已完成用实心圆 + 青色，当前版本 v0.7.0 高亮放大，下一版 v0.7.x 规划中。</desc>

  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C1E2E"/>
      <stop offset="0.6" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#3A3F4E"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="260" rx="20" fill="#07080A"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="20" fill="none" stroke="#1C1E2E" stroke-width="1"/>

  <!-- 标题 -->
  <text x="56" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#3A3F4E" letter-spacing="2.5">ROADMAP  /  v0.4.3 → v0.7.x  /  5 RELEASES  /  v0.7.0 CURRENT</text>
  <rect x="56" y="52" width="32" height="2" fill="#00B4D8"/>

  <!-- 时间线轨道 (y=124) -->
  <line x1="100" y1="124" x2="1100" y2="124" stroke="url(#railGrad)" stroke-width="2"/>
  <!-- 未来虚线 -->
  <line x1="1100" y1="124" x2="1144" y2="124" stroke="#3A3F4E" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 5 个里程碑 + 1 个规划: x at 130, 320, 510, 700, 890, 1080 (190 spacing) -->

  <!-- Milestone 1: v0.4.3 软分层 / Feature Gates -->
  <g transform="translate(130 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v0.4.3</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">软分层 / Gates</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">core/exec 边界 · TOML 门控</text>
  </g>

  <!-- Milestone 2: v0.5.0 知识库 v2 + Wiki-First -->
  <g transform="translate(320 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v0.5.0</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">LLM-Wiki 2.0</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">md 真源 · kl_pipeline 5 阶段</text>
  </g>

  <!-- Milestone 3: v0.5.1 知识库 chunk / attention -->
  <g transform="translate(510 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v0.5.1</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">Chunks / Attention</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">FTS5 检索 · 5 维注意力</text>
  </g>

  <!-- Milestone 4: v0.6.0 统一工作台 / dsh 内置化 -->
  <g transform="translate(700 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v0.6.0</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">统一工作台</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">6 tab · dsh 受管子进程</text>
  </g>

  <!-- Milestone 5: v0.7.0 Sentinel Terminal (current, 最突出) -->
  <g transform="translate(890 124)">
    <circle r="10" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <circle r="16" fill="none" stroke="#00B4D8" stroke-width="1.2" opacity="0.5"/>
    <circle r="22" fill="none" stroke="#00B4D8" stroke-width="0.8" opacity="0.25"/>
    <text x="0" y="-24" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="700" fill="#00B4D8">v0.7.0  ·  CURRENT</text>
    <text x="0" y="32" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="13" font-weight="700" fill="#E4E9F0">Sentinel Terminal</text>
    <text x="0" y="48" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">Data · Judge · Action 三层</text>
  </g>

  <!-- Milestone 6: v0.7.x planned (虚线) -->
  <g transform="translate(1080 124)">
    <circle r="5" fill="#07080A" stroke="#3A3F4E" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#3A3F4E">v0.7.x  ·  planned</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#6B7280">多端协同</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#3A3F4E">MCP 暴露追抓 · 根除 Lock</text>
  </g>

  <!-- 底部脚注 -->
  <text x="56" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#3A3F4E" letter-spacing="1">
    5 Releases shipped  ·  77 migrations  ·  100+ pytest files  ·  300+ frontend tests
  </text>
  <text x="1144" y="220" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#3A3F4E" letter-spacing="1">
    1 user  ·  1 machine  ·  0 external services
  </text>
</svg>
