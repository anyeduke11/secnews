# hotspot/config/llm.yaml
# v2.0 新增：local LLM 配置，缺失时降级为 v1.7 Option A
# v0.6 P0-⑤/⑥：凭据单一来源 + ai_hub 双引擎收敛 ——
#   LLMService（score/summarize 等，走 fallback_order）与 AIService
#   （evaluate/gate_detect 门禁，取 default_provider）共用本文件。
#   密钥只以环境变量名（api_key_env）声明，值不落仓库。

enabled: true  # 总开关；false 时降级为外部 Agent 模式
default_provider: sensenova  # 当前唯一持有凭据的云端 provider；AI_PROVIDER env 可覆盖
fallback_order:  # 失败时降级顺序（仅 LLMService 生成类 API 使用）
  - ollama       # 优先本地（零成本）
  - qwen         # 次选国产
  - openai       # 末选 openai

providers:
  sensenova:
    type: openai_compatible
    api_key_env: "SENSENOVA_API_KEY"
    base_url: "https://token.sensenova.cn/v1"
    models:
      score: "sensenova-6.8-flash-lite"
      tag: "sensenova-6.8-flash-lite"
      ner: "sensenova-6.8-flash-lite"
      summary: "sensenova-6.8-flash-lite"
      chunk_summary: "sensenova-6.8-flash-lite"
    timeout_seconds: 20
    max_concurrent: 2

  # S4-1: sensenova 生产端 (与 sensenova 走同协议, 不同 base_url + 模型档位)
  # 适用于客户已开 sensenova 付费通道 / 想用更大上下文模型
  sensenova_prod:
    type: openai_compatible
    api_key_env: "SENSENOVA_API_KEY"
    base_url: "https://api.sensenova.cn/v1"
    models:
      score: "sensenova-70b"
      tag: "sensenova-70b"
      ner: "sensenova-70b"
      summary: "sensenova-72b"
      chunk_summary: "sensenova-70b"
    timeout_seconds: 30
    max_concurrent: 4

  # S4-1: dots.ai (用户自配 LLM, OpenAI 兼容 /chat/completions)
  # 端点 / 鉴权见 https://dots.ai/platform/docs#messages-api
  # 选用该 provider 时请把 llm_secrets 的 provider 字段设为 "dots_ai"
  dots_ai:
    type: openai_compatible
    api_key_env: "DOTS_API_KEY"
    base_url: "https://api.dots.ai/v1"
    models:
      score: "dots-v1-flash"
      tag: "dots-v1-flash"
      ner: "dots-v1-flash"
      summary: "dots-v1-pro"
      chunk_summary: "dots-v1-flash"
    timeout_seconds: 30
    max_concurrent: 4

  ollama:
    type: ollama
    base_url: "http://127.0.0.1:11434"
    models:
      score: "qwen2.5:7b"
      tag: "qwen2.5:7b"
      ner: "qwen2.5:7b"
      summary: "qwen2.5:14b"
      chunk_summary: "qwen2.5:7b"
    timeout_seconds: 30
    max_concurrent: 4

  openai:
    type: openai
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models:
      score: "gpt-4o-mini"
      tag: "gpt-4o-mini"
      ner: "gpt-4o-mini"
      summary: "gpt-4o"
      chunk_summary: "gpt-4o-mini"
    timeout_seconds: 20
    max_concurrent: 8

  qwen:
    type: openai_compatible
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      score: "qwen-turbo"
      tag: "qwen-turbo"
      ner: "qwen-turbo"
      summary: "qwen-plus"
      chunk_summary: "qwen-turbo"

  anthropic:
    type: anthropic
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      summary: "claude-3-5-sonnet-20241022"
      chunk_summary: "claude-3-5-haiku-20241022"

# S4-1: model_router 真正消费 task_overrides; 之前是死配置 (ai_hub 不读)
# - t1_score     → router STANDARD 档, 覆盖 score / ner 任务 (T1 评分)
# - t3_summary   → router HEAVY 档, 覆盖 deep_read / report 任务
# - t3_chunk_summary → router FLASH 档, 覆盖 summarize / chunk_summary
task_overrides:
  t1_score:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.0
    max_tokens: 50
  t3_summary:
    provider: openai
    model: gpt-4o
    temperature: 0.3
    max_tokens: 500
  t3_chunk_summary:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.0
    max_tokens: 100
    batch_size: 10

rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 100000

cost_alert:
  daily_usd_limit: 5.0
  monthly_usd_limit: 100.0
  on_exceeded: warn  # warn | block | fallback_local

cache:
  enabled: true
  ttl_seconds: 86400  # 24h
  similarity_threshold: 0.95