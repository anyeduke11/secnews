<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">SecNews 架构总览 — 三层架构</title>
  <desc id="arch-desc">三层架构：Layer 1 客户端（浏览器 React SPA / 外部 AI Agent），Layer 2 FastAPI 单进程（Routers / Collectors / Quality Gates / Services / Scheduler / Security KG），Layer 3 持久化（SQLite WAL / .md 文件系统 / CodeGarden 项目存储 / WebDAV 同步）。MCP 桥接将内部数据暴露给外部 AI Agent。</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#0096B4"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F72585"/>
      <stop offset="1" stop-color="#D61C6E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3F4E"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="460" rx="20" fill="#07080A"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="20" fill="none" stroke="#1C1E2E" stroke-width="1"/>

  <!-- 标题 -->
  <text x="56" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#3A3F4E" letter-spacing="2.5">ARCHITECTURE  /  3 LAYERS  /  1 PROCESS  /  port 8000</text>
  <rect x="56" y="52" width="32" height="2" fill="url(#accent)"/>

  <!-- ═══════ LAYER 1: 客户端 (y=72..160) ═══════ -->
  <g transform="translate(56 72)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#3A3F4E" letter-spacing="2">LAYER 1  /  CLIENTS</text>

    <!-- 浏览器卡片 -->
    <g transform="translate(0 14)">
      <rect x="0" y="0" width="440" height="64" rx="10" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="64" fill="url(#accent)" rx="1"/>
      <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="9" fill="#00B4D8" letter-spacing="1.5">BROWSER  ·  React 18 SPA  ·  Port 8898</text>
      <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" font-weight="600" fill="#E4E9F0">SecNews  ·  Knowledge  ·  CodeGarden  ·  Security Graph</text>
      <text x="16" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">150+ 组件  ·  Vite 5  ·  TypeScript  ·  Tailwind</text>
    </g>

    <!-- HTTP/JSON 箭头 -->
    <g stroke="#3A3F4E" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
      <line x1="460" y1="46" x2="520" y2="46"/>
    </g>
    <text x="490" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="8" fill="#3A3F4E" text-anchor="middle">HTTP / JSON</text>

    <!-- AI Agent 卡片 -->
    <g transform="translate(600 14)">
      <rect x="0" y="0" width="440" height="64" rx="10" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="9" fill="#6B7280" letter-spacing="1.5">EXTERNAL AI AGENT  ·  via MCP protocol</text>
      <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" font-weight="600" fill="#E4E9F0">Cursor  ·  Claude Desktop  ·  Trae  ·  Workbuddy</text>
      <text x="16" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#6B7280">推理由外部 AI Agent 完成，hotspot 只负责数据</text>
    </g>
  </g>

  <!-- 向下箭头：浏览器 → FastAPI -->
  <g stroke="#00B4D8" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)">
    <line x1="276" y1="150" x2="276" y2="186"/>
  </g>

  <!-- ═══════ LAYER 2: FastAPI 进程 (y=186..380) ═══════ -->
  <g transform="translate(56 186)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#3A3F4E" letter-spacing="2">LAYER 2  /  FastAPI PROCESS  ·  WORKERS=1  ·  SQLite WAL</text>

    <g transform="translate(0 14)">
      <rect x="0" y="0" width="1088" height="170" rx="12" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="170" fill="url(#accent)" rx="1"/>

      <!-- 第 1 行：4 个模块 -->
      <g transform="translate(16 16)">
        <!-- API Routers -->
        <g>
          <rect width="252" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">55 ROUTERS  ·  REST API</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">/hotspots  ·  /knowledge  ·  /codegarden</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">SSE  ·  lazy imports  ·  OpenAPI docs</text>
        </g>
        <!-- Collectors -->
        <g transform="translate(268 0)">
          <rect width="252" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">14 COLLECTORS  ·  7 领域</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">AI  ·  Security  ·  Finance  ·  GitHub</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">HN  ·  Reddit  ·  GDELT  ·  OpenBB</text>
        </g>
        <!-- Quality Gates -->
        <g transform="translate(536 0)">
          <rect width="252" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">13 QUALITY GATES  ·  pipeline</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">Schema  ·  Duplicate  ·  Recency  ·  Noise</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">URL  ·  Content  ·  AI  ·  Reputation</text>
        </g>
        <!-- Services -->
        <g transform="translate(804 0)">
          <rect width="252" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">81 SERVICES  ·  business logic</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">Sync  ·  Knowledge  ·  CodeGarden</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">AI  ·  Security Graph  ·  Attention</text>
        </g>
      </g>

      <!-- 第 2 行：3 个模块 -->
      <g transform="translate(16 88)">
        <!-- Scheduler -->
        <g>
          <rect width="344" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">APScheduler  ·  43 JOBS</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">Collection  ·  Sync  ·  Catchup  ·  Revival</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">Quality  ·  Security  ·  Attention  ·  Backup</text>
        </g>
        <!-- Security KG -->
        <g transform="translate(360 0)">
          <rect width="344" height="58" rx="8" fill="#07080A" stroke="#1C1E2E" stroke-width="1"/>
          <rect x="0" y="0" width="3" height="58" fill="url(#alertGrad)" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#F72585" letter-spacing="1.5">SECURITY  ·  knowledge graph</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">MITRE ATT&amp;CK  ·  NVD CVE  ·  等保 2.0</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">实体提取  ·  关系推理  ·  合规自动判定</text>
        </g>
        <!-- MCP Server -->
        <g transform="translate(720 0)">
          <rect width="344" height="58" rx="8" fill="#07080A" stroke="#00B4D8" stroke-width="1.2"/>
          <rect x="0" y="0" width="3" height="58" fill="#00B4D8" rx="1"/>
          <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="9" fill="#00B4D8" letter-spacing="1.5">MCP SERVER  ·  9 工具</text>
          <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
                font-size="12" fill="#E4E9F0">5 读 + 4 写  ·  stdio / SSE</text>
          <text x="14" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                font-size="10" fill="#6B7280">fastapi-mcp  ·  OpenAPI → MCP 自动转换</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 向下箭头：FastAPI → 存储层 -->
  <g stroke="#3A3F4E" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="276" y1="372" x2="276" y2="400"/>
  </g>

  <!-- MCP 箭头：FastAPI → 外部 AI Agent -->
  <g stroke="#00B4D8" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)">
    <path d="M 1040 280 L 1040 120"/>
  </g>
  <text x="1050" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="9" fill="#00B4D8">MCP / stdio · SSE</text>

  <!-- ═══════ LAYER 3: 持久化 (y=400..460) ═══════ -->
  <g transform="translate(56 400)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#3A3F4E" letter-spacing="2">LAYER 3  /  PERSISTENCE</text>

    <g transform="translate(0 12)">
      <!-- SQLite -->
      <g>
        <rect x="0" y="0" width="252" height="40" rx="8" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1"/>
        <rect x="0" y="0" width="3" height="40" fill="#00B4D8" rx="1"/>
        <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#00B4D8" letter-spacing="1.5">SQLite  ·  WAL</text>
        <text x="14" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#E4E9F0">hotspot.db  ·  59 migrations  ·  24h 备份</text>
      </g>
      <!-- .md 文件系统 -->
      <g transform="translate(268 0)">
        <rect x="0" y="0" width="252" height="40" rx="8" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1"/>
        <rect x="0" y="0" width="3" height="40" fill="#00B4D8" rx="1"/>
        <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#00B4D8" letter-spacing="1.5">.md 文件系统</text>
        <text x="14" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#E4E9F0">knowledge/  ·  LLM-Wiki  ·  git 友好</text>
      </g>
      <!-- CodeGarden 项目存储 -->
      <g transform="translate(536 0)">
        <rect x="0" y="0" width="252" height="40" rx="8" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1"/>
        <rect x="0" y="0" width="3" height="40" fill="#00B4D8" rx="1"/>
        <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#00B4D8" letter-spacing="1.5">codegarden/</text>
        <text x="14" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#E4E9F0">specs  ·  sdds  ·  playbooks  ·  memory</text>
      </g>
      <!-- WebDAV 同步 -->
      <g transform="translate(804 0)">
        <rect x="0" y="0" width="252" height="40" rx="8" fill="#0D0E14" stroke="#1C1E2E" stroke-width="1" stroke-dasharray="3 3"/>
        <rect x="0" y="0" width="3" height="40" fill="#3A3F4E" rx="1"/>
        <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="9" fill="#6B7280" letter-spacing="1.5">WebDAV SYNC  ·  optional</text>
        <text x="14" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="10" fill="#6B7280">zip 容器  ·  Fernet 加密  ·  坚果云</text>
      </g>
    </g>
  </g>
</svg>