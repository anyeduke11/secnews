# 扩展层开关源 — 代码完整保留，运行时按此开关控制可见性
# false = 路由不注册 + job 不调度 + 前端 tab 隐藏
# 用于将"一时兴起的功能"降级为插拔扩展，不伤害核心管道

[extensions]
codegarden = true           # M1 项目生命周期 (项目/记忆/Prompt/SDD)
codegarden_phase2b = true   # D5 Batch ⑧: M2/M3/M4 服务网格/资源中枢/编排引擎 (开闸, P1.6 收缩解除)
mcp        = false      # MCP Server (SSE + stdio + 19 tools) — v0.8.1 Day 0 演练裁定回关:
                        # extension gate 只控制 /api/mcp/* 调试路由; MCP server 本体由
                        # is_mcp_enabled() 读 config.feature_mcp, 两套开关语义分裂 (P2 备忘)
sync       = true       # 跨端同步 (WebDAV + Fernet)
tech_stack = true       # D5 Batch ⑧: 技术栈管理 + 漂移评估 (开闸)
security_graph = true    # D5 Batch ⑧: Security Graph + MITRE 同步 (开闸)
secnews    = true       # SecNews 安全看板 (KL 管线 + Feed + Wiki 浏览)
crm        = true       # CRM 业绩座舱 (security-cockpit 方案 C, 用户拍板 2026-08-25)
dsh        = true       # v0.6.3 内置化 — dsh 认知大脑 (受管子进程, 前端一键启停) + pi 执行 agent
                   # 启停/配置经 /api/dsh/control/* 与 /secnews/settings 控制面板;
                   # 未配置启动命令时状态如实显示 not_configured, 业务自动降级 LLM 直连。
                   # (P1-2 曾降级 false; 内置化完成后 gate 仅作总可见性开关)
info_filter = true   # v0.8 P1 独立资讯筛选门禁 — allow/deny 规则 CRUD + 实时启停
                   # v0.8.1 Day 0 开闸演练通过 (2026-09-05), 通电 (PRD F5 [假设]: 演练后保持全开)
                   # 关闭时 collector 完全不查规则表, 零开销; 启用走 /api/info-filter/* 面板.
skill_registry = true  # v0.8 Phase A A3 — Skill 商店 (20 内置 skill + 启停 + trigger-gate 触发)
                   # 路由 /api/skill-registry/*; v0.8.1 Day 0 演练实测 20 skill 全注册 (2026-09-05).
trigger_gate = true  # v0.8 Phase A A1+A5 — skill/playbook 触发单一入口
                   # (限流 60/min·user + 600/min 全局 / trigger_tickets 持久化队列 /
                   #  三档优先级非抢占 / TriggerWorker 出队泵); v0.8.1 Day 0 演练通过 (2026-09-05).
agent_loop = true     # v0.8 Phase B B1 — AgentLoop 五阶段状态机
                   # (Intent→Plan→Execute→Reflect→Commit + loop_checkpoints 崩溃恢复 + REFLECT 重试 1).
                   # v0.8.1 Day 0: 无独立消费点 (服务层内部), 键随七 gate 通电置 true.
playbook_engine = true  # v0.8 Phase C C1+C2 — Playbook YAML 引擎 + cron 调度
                   # (step 类型仅 skill/api/condition, 50step/1h 上限, 危险命令黑名单 P4-7);
                   # v0.8.1 Day 0: 无独立消费点, 键随七 gate 通电置 true.
user_skills = true     # v0.8 Phase C C3 — Skill Builder (用户自建 skill)
                   # (user_skills 表 50 上限 + 软删 + dry-run + importlib.find_spec 校验);
                   # v0.8.1 Day 0 修复: gate 名此前漏登记 (_EXTENSION_NAMES) 恒 False,
                   # /api/skill-builder 从未注册 — 补登记后演练实测 200 (2026-09-05).
skill_eval = true     # v0.8 Phase C C5 — Eval (5 黄金 fixture + 评分 + 报告)
                   # v0.8.1 Day 0: 无独立消费点, 键随七 gate 通电置 true.

