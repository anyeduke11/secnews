# hotspot/config/llm.yaml
# v2.0 新增：local LLM 配置，缺失时降级为 v1.7 Option A
# v0.6 P0-⑤/⑥：凭据单一来源 + ai_hub 双引擎收敛 ——
#   LLMService（score/summarize 等，走 fallback_order）与 AIService
#   （evaluate/gate_detect 门禁，取 default_provider）共用本文件。
#   密钥只以环境变量名（api_key_env）声明，值不落仓库。

enabled: true  # 总开关；false 时降级为外部 Agent 模式
default_provider: pi  # 2026-09-27 owner 裁决: pi 升主力 (AI_PROVIDER env 可覆盖临时切回)
fallback_order:  # 失败时降级顺序（仅 LLMService 生成类 API 使用）
  - pi           # 主力: 子进程 pi -p --mode json (claude-sonnet-4-5, 认证自管 ~/.pi/agent/auth.json)
  - ollama       # 兜底1: 本地零成本 (pi 子进程/auth 失效时首选; 离线时自动落下一项)
  - sensenova    # 兜底2: 唯一持凭据云端 provider (v0.6.3 P0-3 原注释保留: 此前三者全不可用审计)
  - qwen         # 次选国产
  - openai       # 末选 openai

providers:
  sensenova:
    type: openai_compatible
    api_key_env: "SENSENOVA_API_KEY"
    base_url: "https://token.sensenova.cn/v1"
    models:
      score: "sensenova-6.8-flash-lite"
      tag: "sensenova-6.8-flash-lite"
      ner: "sensenova-6.8-flash-lite"
      summary: "sensenova-6.8-flash-lite"
      chunk_summary: "sensenova-6.8-flash-lite"
      # v0.7.4-image: IMAGE 档模型 (image_generation/image_understand)
      image: "sensenova-u1.5-lite"
    timeout_seconds: 90
    max_concurrent: 2
    # 关闭推理模式: 实测同一份深度阅读负载, 默认 84s(其中 reasoning 428 tokens)
    # → 本开关下 11s(reasoning 0)。20s 的旧超时对任何真实生成都必然失败。
    extra_request_body:
      thinking:
        type: "disabled"
    # v0.8.2 X-B1: per-provider 断路器阈值 (v0.8.1 PRD §7 推迟项偿还)。
    # 解析链: 此处 per-provider 值 > env 全局 (HOTSPOT_BREAKER_*) > 内建默认
    # (0.5 / 4 / 30s)。未声明字段沿用全局; 当前无差异化实证, 保持注释样例。
    # breaker:
    #   failure_threshold: 0.4   # (0,1] 5min 窗失败率阈值
    #   min_samples: 6           # >=1 判定最小样本数 (防单发误熔断)
    #   recovery_timeout: 60     # >0  breaker OPEN 时长秒

  # 2026-09-18 方案 B: pi provider (第 5 种 type) — earendil-works agent harness
  # 子进程通道 (pi -p --mode json, NDJSON 输出), 认证自管 ~/.pi/agent/auth.json,
  # 无需 base_url / api_key_env。上游 429 时 rc=0 但 stopReason=="error" → 计失败,
  # 由 fallback_order 兜底 (gateway _call_provider pi 分支)。
  # 2026-09-27 pi 主力化 + 实弹修正: models 留空 = 不下传 --model, 用 pi 默认
  # 上游。裸模型名 (claude-sonnet-4-5) 在 pi 0.87.1 跨 3 provider 歧义且无已
  # 认证项 → rc=1; 裸调实测走 sensenova/deepseek-v4-flash (cost 0) 正常。
  # owner 日后 pi auth 其他上游后, 可在此写全限定名 (如 provider/model)。
  pi:
    type: pi
    models:
      score: ""
      tag: ""
      ner: ""
      summary: ""
      chunk_summary: ""
    timeout_seconds: 90   # 子进程含冷启动 + pi 默认注入 ~29K 上下文 (实测)
    max_concurrent: 2     # 子进程型 provider, 并发宜低

  # v0.6.3 P0-3: 以下两个示例 provider (sensenova_prod / dots_ai) 已删除 —
  # sensenova_prod 与 sensenova 同 key 却无任何路由指向 (死配置), dots_ai 无
  # 凭据且仅作占位。二者在 /api/llm/status 里制造 "多模型矩阵" 的完成错觉。
  # 需要接入新 provider 时: 在此添加条目 + 设对应 api_key_env 环境变量 +
  # (如走 egress 校验) 在 backend/services/ai_hub/egress.py 加域名。

  ollama:
    type: ollama
    base_url: "http://127.0.0.1:11434"
    models:
      score: "qwen2.5:7b"
      tag: "qwen2.5:7b"
      ner: "qwen2.5:7b"
      summary: "qwen2.5:14b"
      chunk_summary: "qwen2.5:7b"
    timeout_seconds: 30
    max_concurrent: 4

  openai:
    type: openai
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models:
      score: "gpt-4o-mini"
      tag: "gpt-4o-mini"
      ner: "gpt-4o-mini"
      summary: "gpt-4o"
      chunk_summary: "gpt-4o-mini"
    timeout_seconds: 20
    max_concurrent: 8

  qwen:
    type: openai_compatible
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    models:
      score: "qwen-turbo"
      tag: "qwen-turbo"
      ner: "qwen-turbo"
      summary: "qwen-plus"
      chunk_summary: "qwen-turbo"

  anthropic:
    type: anthropic
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      summary: "claude-3-5-sonnet-20241022"
      chunk_summary: "claude-3-5-haiku-20241022"

# S4-1: model_router 真正消费 task_overrides; 之前是死配置 (ai_hub 不读)
# - t1_score     → router STANDARD 档, 覆盖 score / ner 任务 (T1 评分)
# - t3_summary   → router HEAVY 档, 覆盖 deep_read / report 任务
# - t3_chunk_summary → router FLASH 档, 覆盖 summarize / chunk_summary
task_overrides:
  # v0.6.3 P0-3: t1_score 由 ollama 改为 sensenova —— override 是单点选择
  # (无 fallback 链), 指向未运行的 ollama = evaluate/gate_detect 必败
  # (审计发现 #3: t1_score override 劫持 AIService)。ollama 可用时如需
  # 切回本地, 改回 provider: ollama 即可。
  # 2026-09-19: 改指 pi —— STANDARD 档路由锚点, score / ner 以及未知任务
  # semantic_filter / ai_classify (get_tier 默认 STANDARD) 四任务统一首选 pi,
  # 失败自动落 fallback_order (ollama→sensenova→qwen→openai)。
  # 注意: AIService evaluate/gate_detect 同锚此 override, 一并 pi 首选。
  # max_tokens 50→512: 此档现承载 NER 实体 JSON / 语义 verdict JSON,
  # 50 tokens 必截断 (score 本身输出极短, 上调无副作用)。
  # P0-1 (v0.8.6): model 保持空串 — gateway._resolve_model 现已真实消费
  # override.model, 而裸模型名 (claude-sonnet-4-5) 在 pi 0.87.1 跨 3 provider
  # 歧义且无已认证项 → rc=1 (见上方 2026-09-27 注)。owner pi auth 全限定名
  # (provider/model) 后再填; 空串 = 不下传 --model, 走 pi 默认上游。
  t1_score:
    provider: sensenova
    model: deepseek-v4.1-flash
    temperature: 0.0
    max_tokens: 512
  # HEAVY 档入口 (当前唯一生产调用方 = 深度阅读)。
  # 原为 openai/gpt-4o, 但实测 OPENAI_API_KEY 未配置 → 该链必然失败,
  # deep_reads 表因此长期 0 行。sensenova 是唯一持凭据且实测可达的通道。
  # v0.7.4-image: 升级到 deepseek-v4-pro (spike 验过 meeting 真输出), yaml-only
  # 改动 → deep_read 路由自动生效, 零代码改动。
  t3_summary:
    provider: sensenova
    model: deepseek-v4.1-flash
    temperature: 0.3
    max_tokens: 1600
  # FLASH 档 (summarize/chunk_summary): ollama 优先, 离线时经
  # fallback_order 落到 sensenova (LLMService 有降级链, 与 t1_score 不同)
  t3_chunk_summary:
    provider: sensenova
    model: sensenova-6.8-flash-lite
    temperature: 0.0
    max_tokens: 100
    batch_size: 10
  # v0.7.4-image: IMAGE 档入口 (image_generation/image_understand 任务)
  # u1.5-lite 公测期 watermark=false 免费 (官方明示), 上限 60s 超时。
  image_generation:
    provider: sensenova
    model: sensenova-u1.5-lite
    size: "1024x1024"
    n: 1
    watermark: false

rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 100000

cost_alert:
  daily_usd_limit: 5.0
  monthly_usd_limit: 100.0
  on_exceeded: warn  # warn | block | fallback_local

cache:
  enabled: true
  ttl_seconds: 86400  # 24h
  similarity_threshold: 0.95