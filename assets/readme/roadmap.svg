<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">SecNews 路线图 — 7 个 Phase</title>
  <desc id="rm-desc">从 v1.0 到 v1.9+ 的 7 个 Phase 横向时间线。已完成用实心圆 + 青色，当前版本高亮放大，规划用虚线圆。</desc>

  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C1E2E"/>
      <stop offset="0.6" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#3A3F4E"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="260" rx="20" fill="#07080A"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="20" fill="none" stroke="#1C1E2E" stroke-width="1"/>

  <!-- 标题 -->
  <text x="56" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#3A3F4E" letter-spacing="2.5">ROADMAP  /  v1.0 → v1.9+  /  7 PHASES  /  v0.4.3 CURRENT</text>
  <rect x="56" y="52" width="32" height="2" fill="#00B4D8"/>

  <!-- 时间线轨道 (y=124) -->
  <line x1="100" y1="124" x2="1100" y2="124" stroke="url(#railGrad)" stroke-width="2"/>
  <!-- 未来虚线 -->
  <line x1="1100" y1="124" x2="1144" y2="124" stroke="#3A3F4E" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 7 个里程碑: x at 100, 263, 426, 589, 752, 915, 1078 (163 spacing) -->

  <!-- Milestone 1: v1.0-v1.4 热点聚合 -->
  <g transform="translate(100 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v1.0 – v1.4</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">热点聚合</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">5 分类 · 13 门禁 · 同步</text>
  </g>

  <!-- Milestone 2: v1.5 Security KG -->
  <g transform="translate(263 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v1.5</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">安全图谱</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">MITRE · CVE · 合规</text>
  </g>

  <!-- Milestone 3: v1.6 CodeGarden 2b -->
  <g transform="translate(426 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v1.6</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">CodeGarden 2b</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">服务网格 · 资源中枢 · 联动</text>
  </g>

  <!-- Milestone 4: v1.7.1-7.5 知识生命周期 -->
  <g transform="translate(589 124)">
    <circle r="5" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#E4E9F0">v1.7.1 – 7.5</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">知识生命周期</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">SM-2 复习 · 告警 · 画像</text>
  </g>

  <!-- Milestone 5: v1.7.6 MCP Server -->
  <g transform="translate(752 124)">
    <circle r="7" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <circle r="12" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.35"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#00B4D8">v1.7.6  ·  Phase 7</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#E4E9F0">MCP Server</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">9 tools · stdio / SSE</text>
  </g>

  <!-- Milestone 6: v1.8 追抓 (current, 最突出) -->
  <g transform="translate(915 124)">
    <circle r="10" fill="#00B4D8" stroke="#07080A" stroke-width="2"/>
    <circle r="16" fill="none" stroke="#00B4D8" stroke-width="1.2" opacity="0.5"/>
    <circle r="22" fill="none" stroke="#00B4D8" stroke-width="0.8" opacity="0.25"/>
    <text x="0" y="-24" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="700" fill="#00B4D8">v1.8  ·  Phase 8  ·  CURRENT</text>
    <text x="0" y="32" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="13" font-weight="700" fill="#E4E9F0">追抓资讯</text>
    <text x="0" y="48" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6B7280">watchdog · manual API · 死源复活</text>
  </g>

  <!-- Milestone 7: v1.9+ planned (虚线) -->
  <g transform="translate(1078 124)">
    <circle r="5" fill="#07080A" stroke="#3A3F4E" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="0" y="-20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" fill="#3A3F4E">v1.9+  ·  planned</text>
    <text x="0" y="30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="600" fill="#6B7280">MCP 暴露追抓</text>
    <text x="0" y="46" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#3A3F4E">多端同步 · 根除 Lock bug</text>
  </g>

  <!-- 底部脚注 -->
  <text x="56" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#3A3F4E" letter-spacing="1">
    7 Phases shipped  ·  59 migrations  ·  100+ pytest files  ·  290+ frontend tests
  </text>
  <text x="1144" y="220" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#3A3F4E" letter-spacing="1">
    1 user  ·  1 machine  ·  0 external services
  </text>
</svg>