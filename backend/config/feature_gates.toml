# 扩展层开关源 — 代码完整保留，运行时按此开关控制可见性
# false = 路由不注册 + job 不调度 + 前端 tab 隐藏
# 用于将"一时兴起的功能"降级为插拔扩展，不伤害核心管道

[extensions]
codegarden = true           # M1 项目生命周期 (项目/记忆/Prompt/SDD)
codegarden_phase2b = false  # M2/M3/M4 服务网格/资源中枢/编排引擎 (P1.6 收缩关闭)
mcp        = false      # MCP Server (SSE + stdio + 9 tools)
sync       = true       # 跨端同步 (WebDAV + Fernet)
tech_stack = false      # 技术栈管理 + 漂移评估
security_graph = false  # Security Graph + MITRE 同步
secnews    = true       # SecNews 安全看板 (KL 管线 + Feed + Wiki 浏览)
crm        = true       # CRM 业绩座舱 (security-cockpit 方案 C, 用户拍板 2026-08-25)
dsh        = false      # P1-2 降级为实验性 — DSH 桥接层 (DeepSeek Harness HTTP 桥接, v0.6)
                   # 启用条件: ① 设置 DSH_ENDPOINT 环境变量 (默认 http://localhost:3210)
                   # ② DeepSeek Harness 实际运行并暴露 /health /api/task 端点
                   # ③ 测试 DSH 不可达时自动降级 llm_service 直连 (无需改业务代码)
workbench_legacy = true  # P2-3 三层目录退役规划 — v0.6.2+ 默认开保持向后兼容
                   # 关闭: 1) /data/* /judge/* /action/* 路由 404
                   #      2) 客户端导航隐藏 data/judge/action 三层入口
                   # 功能等价物: /workbench 5 视图 (Briefing/Pipeline/Knowledge/Analyze/Settings)
                   # 计划: v0.7+ 集中删除 16 个 .tsx 组件 + 10 个路由
