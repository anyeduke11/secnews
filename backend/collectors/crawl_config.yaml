# hotspot/backend/collectors/crawl_config.yaml
# v1.7 新增: Crawl4ai 高阶抓取配置
# 代理从 proxy_config.json 统一注入，不在此硬编码

crawl4ai:
  enabled: false  # 默认关闭，需用户手动安装 crawl4ai + playwright 后开启
  browser: chromium  # chromium | firefox | webkit
  headless: true
  timeout_seconds: 30
  concurrent_requests: 3
  retry_attempts: 2

  proxy_source: "proxy_config.json"
  proxy_failover: true

  anti_bot:
    user_agent_rotation: true
    random_delay_seconds: [1, 3]
    stealth_mode: true

  cache:
    enabled: true
    backend: sqlite
    ttl_seconds: 604800  # 7 天