<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">SecNews — 单人本地 AI 与安全工作站</title>
  <desc id="hero-desc">左侧品牌与价值主张；右侧 Sentinel 终端窗口展示四菜单壳（资讯 / 知识 / 行动 / 设置）、管道心跳条与架构数字（101 routers · 161 services · 59 jobs · 19 collectors）。</desc>

  <defs>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#0096B4"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F72585"/>
      <stop offset="1" stop-color="#D61C6E"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#12141c" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" rx="20" fill="#07080A"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#1C1E2E" stroke-width="1"/>

  <!-- 盾牌装饰（安全主题） -->
  <g transform="translate(84 190)" opacity="0.05">
    <path d="M0 0 L60 -60 L120 0 L120 80 Q60 140 0 80 Z" fill="none" stroke="#00B4D8" stroke-width="3"/>
  </g>

  <!-- ═══════ 左侧：品牌区 (0–620) ═══════ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="56" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#5A6178" letter-spacing="2.5">v0.8.7 · AI NATIVE · 19 MCP TOOLS · SINGLE-USER LOCAL</text>

    <rect x="56" y="70" width="36" height="3" fill="url(#primaryGrad)" rx="1.5"/>

    <text x="56" y="156" font-size="76" font-weight="700" fill="#F5F7FA" letter-spacing="1">SecNews</text>

    <text x="56" y="198" font-size="23" fill="#8B93A7">AI + 安全从业者 · 单机 AI Native 证据工作台</text>

    <!-- 特性徽章 -->
    <g font-size="15">
      <rect x="56" y="228" width="112" height="32" rx="16" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.75"/>
      <text x="112" y="249" fill="#00B4D8" text-anchor="middle">零外部服务</text>

      <rect x="182" y="228" width="132" height="32" rx="16" fill="none" stroke="#3A3F4E" stroke-width="1"/>
      <text x="248" y="249" fill="#8B93A7" text-anchor="middle">wiki-first 真源</text>

      <rect x="328" y="228" width="104" height="32" rx="16" fill="none" stroke="#3A3F4E" stroke-width="1"/>
      <text x="380" y="249" fill="#8B93A7" text-anchor="middle">MCP 原生</text>
    </g>

    <text x="56" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#5A6178" letter-spacing="1.5">一个人 · 一台电脑 · git clone 即跑</text>
  </g>

  <!-- ═══════ 右侧：Sentinel 终端窗口 (640–1144) ═══════ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- 窗口 -->
    <rect x="640" y="44" width="504" height="272" rx="12" fill="#0C0E14" stroke="#1C1E2E" stroke-width="1"/>

    <!-- 标题栏 -->
    <circle cx="664" cy="66" r="5" fill="#F72585" opacity="0.85"/>
    <circle cx="682" cy="66" r="5" fill="#F4B740" opacity="0.85"/>
    <circle cx="700" cy="66" r="5" fill="#2DD4A7" opacity="0.85"/>
    <text x="892" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#5A6178" text-anchor="middle">sentinel://localhost:8898</text>
    <line x1="640" y1="84" x2="1144" y2="84" stroke="#1C1E2E" stroke-width="1"/>

    <!-- 四菜单 tab -->
    <g font-size="16" font-weight="600">
      <text x="672" y="116" fill="#00B4D8">资讯</text>
      <rect x="664" y="126" width="44" height="2.5" rx="1.25" fill="#00B4D8"/>
      <text x="762" y="116" fill="#5A6178">知识</text>
      <text x="852" y="116" fill="#5A6178">行动</text>
      <text x="942" y="116" fill="#5A6178">设置</text>
    </g>
    <line x1="640" y1="140" x2="1144" y2="140" stroke="#1C1E2E" stroke-width="1"/>

    <!-- 管道心跳条 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      <rect x="664" y="154" width="7" height="7" rx="1.5" fill="#2DD4A7"/>
      <text x="678" y="162" fill="#5A6178">PIPELINE · 19 COLLECTORS · ALL GATES GREEN</text>
      <g fill="#00B4D8">
        <rect x="1010" y="155" width="4" height="6" rx="1" opacity="0.9"/>
        <rect x="1018" y="152" width="4" height="9" rx="1" opacity="0.65"/>
        <rect x="1026" y="156" width="4" height="5" rx="1" opacity="0.45"/>
        <rect x="1034" y="153" width="4" height="8" rx="1" opacity="0.75"/>
        <rect x="1042" y="156" width="4" height="5" rx="1" opacity="0.4"/>
        <rect x="1050" y="151" width="4" height="10" rx="1" opacity="0.9"/>
      </g>
    </g>

    <!-- 内容骨架：feed 行 -->
    <g>
      <rect x="664" y="182" width="10" height="10" rx="2.5" fill="#F72585" opacity="0.9"/>
      <rect x="686" y="182" width="240" height="10" rx="5" fill="#22252F"/>
      <rect x="936" y="182" width="52" height="10" rx="5" fill="#181B24"/>

      <rect x="664" y="206" width="10" height="10" rx="2.5" fill="#00B4D8" opacity="0.9"/>
      <rect x="686" y="206" width="196" height="10" rx="5" fill="#22252F"/>
      <rect x="936" y="206" width="52" height="10" rx="5" fill="#181B24"/>

      <rect x="664" y="230" width="10" height="10" rx="2.5" fill="#3A3F4E"/>
      <rect x="686" y="230" width="264" height="10" rx="5" fill="#181B24"/>

      <rect x="664" y="254" width="10" height="10" rx="2.5" fill="#00B4D8" opacity="0.6"/>
      <rect x="686" y="254" width="170" height="10" rx="5" fill="#181B24"/>
    </g>

    <!-- 底部状态行 -->
    <line x1="640" y1="282" x2="1144" y2="282" stroke="#1C1E2E" stroke-width="1"/>
    <text x="664" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#5A6178">101 ROUTERS · 161 SERVICES · 59 JOBS</text>
    <text x="1120" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#2DD4A7" text-anchor="end">● healthy</text>
  </g>
</svg>
